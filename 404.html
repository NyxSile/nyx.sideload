<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var path = window.location.pathname;
    var segments = path.split('/');
    var repoPath = "";
    if (window.location.hostname.indexOf("github.io") !== -1 && segments.length > 1) {
      repoPath = "/" + segments[1];
    }
    window.location.replace(window.location.origin + repoPath + "/?404");
  </script>
</head>
<body>
  Redirecting to home page...
</body>
</html>
