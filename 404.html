<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — nyx.sideload</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <style>
    :root { color-scheme: dark; --bg:#08080d; --card:#12121b; --line:#29283b; --text:#f7f4ff; --muted:#aaa5bd; --accent:#a78bfa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font:16px/1.5 Inter,system-ui,sans-serif; color:var(--text); background:radial-gradient(circle at 50% 0,#241944 0,#08080d 55%); }
    main { width:min(100%,520px); padding:42px 30px; text-align:center; background:rgba(18,18,27,.86); border:1px solid var(--line); border-radius:24px; box-shadow:0 24px 80px #0008; }
    a { display:inline-block; padding:12px 20px; border-radius:12px; color:#130d22; background:var(--accent); font-weight:700; text-decoration:none; }
    a:hover { filter:brightness(1.12); }
  </style>
</head>
<body>
  <main>
    <img src="icons/404-art.PNG" alt="" style="display:block;width:100%;max-height:240px;object-fit:contain;margin:0 auto 18px;">
    <a href="/">Вернуться на главную</a>
  </main>
</body>
</html>
