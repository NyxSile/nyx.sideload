    :root {
      --bg: #06060c;
      --surface: rgba(18, 18, 29, 0.75);

      --accent-lo: rgba(139, 92, 246, 0.12);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
    }


    #stars {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }


    .vn-container {
      width: 100%;
      max-width: 720px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 24px 20px;
      position: relative;
      z-index: 2;
    }


    .btn-back-vn {
      position: absolute;
      top: 24px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(18, 18, 29, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .btn-back-vn:hover {
      border-color: var(--accent);
      background: var(--accent-lo);
      transform: translateX(-3px);
    }


    .sprite-container {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      margin-bottom: -10px;
      pointer-events: none;
      position: relative;
    }

    .character-sprite {
      max-height: 48vh;
      width: auto;
      object-fit: contain;
      animation: idleBob 4s ease-in-out infinite;
      filter: drop-shadow(0 10px 30px rgba(139, 92, 246, 0.25));
      border-radius: 24px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .character-sprite.active {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes idleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .character-sprite.bounce {
      animation: spriteBounce 0.5s ease;
    }

    @keyframes spriteBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-24px); }
    }


    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 5;
    }
    .choices-container.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .choice-btn {
      background: rgba(18, 18, 29, 0.82);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .choice-btn:hover {
      border-color: var(--accent);
      background: var(--accent-lo);
      transform: translateX(4px);

    .choice-btn::after {
      content: '→';

      transform: translateX(-10px);
      transition: all 0.2s;

    .choice-btn:hover::after {

      transform: translateX(0);

      border-radius: 24px;
      padding: 24px 28px;
      min-height: 140px;
      position: relative;

      box-shadow: 0 20px 50px rgba(0,0,0,0.5);

    .name-tag {

      padding: 4px 18px;

      color: var(--accent);

    .vn-top-bar {

  <script>
    (function initStars() {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const COUNT = 80;
      let W, H, stars = [];

      const COLORS = [
        'rgb(120, 80, 220)',
        'rgb(90, 60, 180)',
        'rgb(160, 100, 255)',
        'rgb(200, 170, 255)'
      ];

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function mkStar() {
        return {
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.5 + 0.3,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          speedX: (Math.random() - 0.5) * 0.05,
          speedY: (Math.random() - 0.5) * 0.05
        };
      }

      function init() {
        resize();
        stars = Array.from({ length: COUNT }, mkStar);
      }

      let raf;
      let isWindowFocused = !document.hidden;

      function draw(shouldAnimate = true) {
        ctx.fillStyle = '#06060c';
        ctx.fillRect(0, 0, W, H);

        const animateNow = shouldAnimate && isWindowFocused;

        for (const s of stars) {
          if (animateNow) {
            s.x += s.speedX;
            s.y += s.speedY;
            if (s.x < 0) s.x = W;
            if (s.x > W) s.x = 0;
            if (s.y < 0) s.y = H;
            if (s.y > H) s.y = 0;
          }

          ctx.fillStyle = s.color;
          ctx.fillRect(s.x, s.y, s.r * 2, s.r * 2);
        }

        if (animateNow) {
          raf = requestAnimationFrame(() => draw(true));
        }
      }

      function startAnimation() {
        isWindowFocused = true;
        cancelAnimationFrame(raf);
        draw(true);
      }

      function stopAnimation() {
        isWindowFocused = false;
        cancelAnimationFrame(raf);
        draw(false);
      }

      window.addEventListener('focus', startAnimation);
      window.addEventListener('blur', stopAnimation);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopAnimation();
        } else {
          startAnimation();
        }
      });

      window.addEventListener('resize', resize);
      init();
      draw(true);
    })();
  </script>

    // Sound generator using Web Audio API (crisp VN typewriter click)
    let audioCtx = null;
    function playBeep() {
      if (!isSoundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

          choices: [
            { text: "🛡️ DNS Profile (Anti-Revoke Protection)", next: "dns_intro" },
            { text: "📲 Installing ESign / KSign", next: "esign_intro" },
            { text: "🔑 Importing HSBC Bank plc Certificate", next: "cert_import" },
            { text: "💻 PC Sideload (LiveContainer & SideStore)", next: "iloader_intro" },
            { text: "❓ Common Errors & Fixes", next: "troubleshooting" }
          ]
        },
        dns_intro: {
          text: "— Let's start with the DNS profile. It is essential to protect your apps from getting revoked.",
          choices: [
            { text: "I'm ready to install", next: "dns_install" },
            { text: "How does it work?", next: "dns_explain" },
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        dns_explain: {
          text: "— The DNS profile blocks Apple revocation servers (*ocsp.apple.com*). All your other web traffic securely resolves through Cloudflare.",
          choices: [
            { text: "Got it, let's install!", next: "dns_install" },
            { text: "Back", next: "dns_intro" }
          ]
        },
        dns_install: {
          text: "— Profile download initiated. Tap 'Allow' in the Safari prompt.",
          action: () => {
            setTimeout(() => {
              window.location.href = '../dns.mobileconfig';
            }, 1000);
          },
          choices: [
            { text: "Downloaded! What next?", next: "dns_activate" },
            { text: "It downloaded a raw file instead", next: "dns_safari" }
          ]
        },
        dns_safari: {
          text: "*Sighs*\n— Make sure you open *nyx.sideload.space* in **Safari**. In-app browsers like Telegram or TikTok block profile installations.",
          choices: [
            { text: "Try again", next: "dns_intro" },
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        dns_activate: {
          text: "— Now open **Settings → General → VPN & Device Management → DNS** and select **nyx-sideload**. You're now protected!",
          choices: [
            { text: "Great! How to install ESign?", next: "esign_intro" },
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        esign_intro: {
          text: "— You can install **ESign** or **KSign** directly from our site. Both are pre-signed with the active **HSBC Bank plc** certificate!",
          choices: [
            { text: "How to install?", next: "esign_steps" },
            { text: "It says 'Untrusted Enterprise Developer'", next: "trust_cert" },
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        esign_steps: {
          text: "— Step 1: On the homepage, tap 'Download' under ESign.\n— Step 2: Choose **HSBC Bank plc** certificate and click 'Install'.\n— Step 3: Confirm iOS installation prompt.",
          choices: [
            { text: "Installed, but won't open!", next: "trust_cert" },
            { text: "Opened! How to sign other IPAs?", next: "cert_import" }
          ]
        },
        trust_cert: {
          text: "— Go to **Settings → General → VPN & Device Management → Enterprise Apps (HSBC Bank plc)** and tap **Trust**.",
          choices: [
            { text: "Worked! Thanks!", next: "cert_import" },
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        cert_import: {
          text: "— To sign custom IPAs inside ESign, you need the certificate (.p12) and profile (.mobileprovision). You can download our ready-to-use zip bundle from the main page!",
          choices: [
            { text: "What is the .p12 password?", next: "cert_pwd_help" },
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        cert_pwd_help: {
          text: "— The password for the HSBC Bank plc certificate is: **AppleP12.com**\nYou can copy it in 1-click on the main website.",
          choices: [
            { text: "Awesome, back to topics!", next: "topics_menu" }
          ]
        },
        iloader_intro: {
          text: "— PC Sideloading via **iLoader** lets you install LiveContainer or SideStore using your personal Apple ID without any revoke risk!",
          choices: [
            { text: "What is LiveContainer?", next: "lc_explain" },
            { text: "What is SideStore?", next: "ss_explain" },
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        lc_explain: {
          text: "— **LiveContainer** lets you run unlimited apps inside a single container, bypassing Apple's 3-app free account limit.",
          choices: [
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        ss_explain: {
          text: "— **SideStore** is an on-device app store that automatically refreshes your apps wirelessly over Wi-Fi VPN.",
          choices: [
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        troubleshooting: {
          text: "— What issue are you experiencing?",
          choices: [
            { text: "Unable to Verify App Integrity", next: "err_integrity" },
            { text: "App icon is greyed out", next: "err_grey_icon" },
            { text: "App crashes immediately on launch", next: "err_crash" },
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        err_integrity: {
          text: "— Make sure our DNS profile is active in Settings, clear Safari cache and restart your device.",
          choices: [
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        err_grey_icon: {
          text: "— Delete the grey icon, make sure DNS is enabled, and try installing again using Safari.",
          choices: [
            { text: "Back to Topics", next: "topics_menu" }
          ]
        },
        err_crash: {
          text: "— On iOS 16+, ensure Developer Mode is enabled under Settings → Privacy & Security → Developer Mode.",
          choices: [
            { text: "Back to Topics", next: "topics_menu" }
          ]
        }
      }
    };

    let currentState = 'start';
    let textInterval = null;
    let isTyping = false;
    let fullText = '';
    let displayedText = '';

    const textEl = document.getElementById('dialogue-text');
    const spriteEl = document.getElementById('breeze-sprite');
    const choicesEl = document.getElementById('choices-container');
    const arrowEl = document.getElementById('dialogue-arrow');
    const boxEl = document.getElementById('dialogue-box');
    const soundBtn = document.getElementById('btn-sound');
    const soundIcon = document.getElementById('sound-icon');
    const menuBtn = document.getElementById('btn-menu');
    const txtBack = document.getElementById('txt-back');
    const txtTopics = document.getElementById('txt-topics');

    function updateUiLang() {
      if (currentVnLang === 'ru') {
        txtBack.textContent = 'На главную';
        txtTopics.textContent = 'Темы';
      } else {
        txtBack.textContent = 'Home';
        txtTopics.textContent = 'Topics';
      }
      document.querySelectorAll('.lang-btn-vn').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === currentVnLang);
      });
    }

    function formatDialogueText(rawText) {
      return rawText.replace(/\*([^*]+)\*/g, '<span class="action-text">*$1*</span>');
    }

    function typeText(targetText, callback) {
      clearInterval(textInterval);
      isTyping = true;
      arrowEl.classList.remove('show');
      choicesEl.classList.remove('show');

      let index = 0;
      displayedText = '';
      textInterval = setInterval(() => {
        if (index < targetText.length) {
          displayedText += targetText[index];
          textEl.innerHTML = formatDialogueText(displayedText);
          if (index % 2 === 0 && targetText[index] !== ' ' && targetText[index] !== '\n') {
            playBeep();
          }
          index++;
        } else {
          clearInterval(textInterval);
          isTyping = false;
          arrowEl.classList.add('show');
          if (callback) callback();
        }
      }, 22);
    }

    function showState(stateKey) {
      currentState = stateKey;
      const langStory = storyData[currentVnLang] || storyData['ru'];
      const stateObj = langStory[stateKey] || langStory['start'];

      spriteEl.classList.add('bounce');
      setTimeout(() => spriteEl.classList.remove('bounce'), 500);

      fullText = stateObj.text;
      if (stateObj.action) {
        stateObj.action();
      }

      typeText(fullText, () => {
        renderChoices(stateObj.choices);
      });
    }

    function renderChoices(choices) {
      choicesEl.innerHTML = '';
      if (!choices || choices.length === 0) return;

      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c.text;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          playBeep();
          if (c.action) c.action();
          if (c.next) showState(c.next);
        });
        choicesEl.appendChild(btn);
      });

      choicesEl.classList.add('show');
    }

    boxEl.addEventListener('click', () => {
      if (isTyping) {
        clearInterval(textInterval);
        isTyping = false;
        textEl.innerHTML = formatDialogueText(fullText);
        arrowEl.classList.add('show');
        const langStory = storyData[currentVnLang] || storyData['ru'];
        renderChoices((langStory[currentState] || langStory['start']).choices);
      }
    });

    // Language switcher
    document.querySelectorAll('.lang-btn-vn').forEach(b => {
      b.addEventListener('click', () => {
        currentVnLang = b.dataset.lang;
        localStorage.setItem('nyx-lang', currentVnLang);
        updateUiLang();
        showState(currentState);
      });
    });

    // Sound toggle
    function updateSoundUi() {
      soundIcon.textContent = isSoundEnabled ? '🔊' : '🔇';
    }
    soundBtn.addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      localStorage.setItem('nyx-vn-sound', isSoundEnabled);
      updateSoundUi();
      if (isSoundEnabled) playBeep();
    });

    // Topics menu button
    menuBtn.addEventListener('click', () => {
      showState('topics_menu');
    });

    window.addEventListener('load', () => {
      updateUiLang();
      updateSoundUi();
      setTimeout(() => {
        spriteEl.classList.add('active');
        showState('start');
      }, 400);
    });
  </script>
