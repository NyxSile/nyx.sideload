<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breeze Visual Novel Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06060c;
      --surface: rgba(18, 18, 29, 0.75);
      --border: rgba(123, 97, 255, 0.15);
      --border-hover: rgba(123, 97, 255, 0.4);
      --accent: #8b5cf6;
      --accent-lo: rgba(139, 92, 246, 0.12);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
    }

    /* Background canvas */
    #stars {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* VN Interface Container */
    .vn-container {
      width: 100%;
      max-width: 720px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 24px 20px;
      position: relative;
      z-index: 2;
    }

    /* Back Home Button */
    .btn-back-vn {
      position: absolute;
      top: 24px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(18, 18, 29, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .btn-back-vn:hover {
      border-color: var(--accent);
      background: var(--accent-lo);
      transform: translateX(-3px);
    }

    /* Character Sprite Container */
    .sprite-container {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      margin-bottom: -10px;
      pointer-events: none;
      position: relative;
    }

    .character-sprite {
      max-height: 48vh;
      width: auto;
      object-fit: contain;
      animation: idleBob 4s ease-in-out infinite;
      filter: drop-shadow(0 10px 30px rgba(139, 92, 246, 0.25));
      border-radius: 24px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .character-sprite.active {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes idleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .character-sprite.bounce {
      animation: spriteBounce 0.5s ease;
    }

    @keyframes spriteBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-24px); }
    }

    /* Choices list */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 5;
    }
    .choices-container.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .choice-btn {
      background: rgba(18, 18, 29, 0.82);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .choice-btn:hover {
      border-color: var(--accent);
      background: var(--accent-lo);
      transform: translateX(4px);
    }
    .choice-btn::after {
      content: '→';
      opacity: 0;
      transform: translateX(-10px);
      transition: all 0.2s;
    }
    .choice-btn:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    /* Dialogue box */
    .dialogue-box {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 24px 28px;
      min-height: 140px;
      position: relative;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    /* Name tag */
    .name-tag {
      position: absolute;
      top: -16px;
      left: 28px;
      background: var(--accent);
      color: white;
      padding: 4px 18px;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }

    /* Dialogue text styling */
    .dialogue-text {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text);
    }

    /* Action highlighted */
    .action-text {
      color: #c084fc;
      font-style: italic;
    }

    /* Text cursor indicator */
    .dialogue-arrow {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 12px;
      color: var(--accent);
      animation: pulse 1.5s infinite;
      display: none;
    }
    .dialogue-arrow.show {
      display: block;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(3px); }
    }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>

  <div class="vn-container">
    <a href="../" class="btn-back-vn">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round"/>
      </svg>
      На главную
    </a>

    <!-- Character Sprite -->
    <div class="sprite-container">
      <img id="breeze-sprite" class="character-sprite" src="../icons/breeze_avatar.jpg" alt="Бриз">
    </div>

    <!-- Choices -->
    <div class="choices-container" id="choices-container"></div>

    <!-- Dialogue Box -->
    <div class="dialogue-box" id="dialogue-box">
      <div class="name-tag">БРИЗ</div>
      <div class="dialogue-text" id="dialogue-text"></div>
      <div class="dialogue-arrow" id="dialogue-arrow">▼</div>
    </div>
  </div>

  <!-- Stars background canvas script -->
  <script>
    (function initStars() {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const COUNT = 80;
      let W, H, stars = [];

      const COLORS = [
        'rgb(120, 80, 220)',
        'rgb(90, 60, 180)',
        'rgb(160, 100, 255)',
        'rgb(200, 170, 255)'
      ];

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function mkStar() {
        return {
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.5 + 0.3,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          speedX: (Math.random() - 0.5) * 0.05,
          speedY: (Math.random() - 0.5) * 0.05
        };
      }

      function init() {
        resize();
        stars = Array.from({ length: COUNT }, mkStar);
      }

      function draw() {
        ctx.fillStyle = '#06060c';
        ctx.fillRect(0, 0, W, H);
        
        for (const s of stars) {
          s.x += s.speedX;
          s.y += s.speedY;

          // Wrap bounds
          if (s.x < 0) s.x = W;
          if (s.x > W) s.x = 0;
          if (s.y < 0) s.y = H;
          if (s.y > H) s.y = 0;

          ctx.fillStyle = s.color;
          ctx.fillRect(s.x, s.y, s.r * 2, s.r * 2);
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      init();
      requestAnimationFrame(draw);
    })();
  </script>

  <!-- VN Logic script -->
  <script>
    const story = {
      start: {
        text: "*Смотрит назад, а потом оборачивается*\n— А, ты уже здесь. Я Бриз, наверное тебя сюда направили чтобы я тебе помогла. Окей.",
        choices: [
          { text: "Начать туториал", next: "dns_intro" }
        ]
      },
      dns_intro: {
        text: "— Начнём с DNS профиля. Он обязателен.",
        choices: [
          { text: "Я готов(-а) к установке", next: "dns_install" },
          { text: "Что это такое?", next: "dns_explain" }
        ]
      },
      dns_explain: {
        text: "— DNS профиль блокирует *oscp.apple.com* и прочие домены проверки сертификатов, чтобы ваши подписанные приложения не слетели через пару часов после установки. Любые другие не связанные с ними домены будут пускаться по Cloudflare, так что всё безопасно. Если тебе хватает опыта, открой на компьютере и проверь содержимое.",
        choices: [
          { text: "Я готов(-а) к установке", next: "dns_install" }
        ]
      },
      dns_install: {
        text: "— Отлично, я отправила тебе запрос на установку. *установка начнётся через 5 секунд после завершения фразы.*",
        action: () => {
          setTimeout(() => {
            window.location.href = '../dns.mobileconfig';
          }, 5000);
        },
        choices: [
          { text: "У меня всё установилось", next: "dns_done" },
          { text: "У меня почему-то скачался .mobileconfig", next: "dns_safari" }
        ]
      },
      dns_safari: {
        text: "*Вздыхает*\n— Странно. Попробуй начать заново, но уже в браузере Safari. Другое не подойдёт.",
        choices: [
          { text: "Попробовать снова", next: "dns_intro" }
        ]
      },
      dns_done: {
        text: "— Прекрасно. Теперь зайди в настройки, DNS и VPN, нажми на ‘nyx-sideload’ и нажми ‘Применить’.",
        choices: [
          { text: "А это безопасно вообще?", next: "dns_explain_done" },
          { text: "Окей, сделано!", next: "next_chapter" }
        ]
      },
      dns_explain_done: {
        text: "— DNS профиль блокирует *oscp.apple.com* и прочие домены проверки сертификатов, чтобы ваши подписанные приложения не слетели через пару часов после установки. Любые другие не связанные с ними домены будут пускаться по Cloudflare, так что всё безопасно. Если тебе хватает опыта, открой на компьютере и проверь содержимое.",
        choices: [
          { text: "Окей, сделано!", next: "next_chapter" }
        ]
      },
      next_chapter: {
        text: "— Умница! С DNS профилем мы разобрались. Теперь ты под защитой от отзывов серверов Apple.\n\nКакая у тебя цель дальше? Хочешь узнать про установку приложений через компьютер?",
        choices: [
          { text: "Да, расскажи про iLoader", next: "iloader_intro" },
          { text: "Вернуться на главную", action: () => window.location.href = '../' }
        ]
      },
      iloader_intro: {
        text: "— Для установки SideStore или LiveContainer тебе понадобится компьютер и наша утилита iLoader. Это намного проще и безопаснее, чем вводить Apple ID на сайтах.",
        choices: [
          { text: "Что такое LiveContainer?", next: "lc_explain" },
          { text: "Что такое SideStore?", next: "ss_explain" },
          { text: "Назад", next: "next_chapter" }
        ]
      },
      lc_explain: {
        text: "— LiveContainer позволяет запускать сколько угодно IPA файлов внутри одного контейнера! Они не тратят лимит бесплатных слотов Apple ID (у обычного аккаунта лимит — 3 приложения).",
        choices: [
          { text: "Как установить LiveContainer?", next: "lc_steps" },
          { text: "Назад", next: "iloader_intro" }
        ]
      },
      lc_steps: {
        text: "— Шаг 1: Подключи устройство по USB.\n— Шаг 2: Скачай iLoader на компьютер и нажми Install LiveContainer.\n— Шаг 3: На устройстве зайди в Настройки -> Управление устройством и нажми Доверять.\n\nПроще простого!",
        choices: [
          { text: "Понятно!", next: "iloader_intro" }
        ]
      },
      ss_explain: {
        text: "— SideStore — это полноценный магазин приложений прямо на твоем телефоне. Он умеет автоматически перезапускать 7-дневный срок действия сертификата по Wi-Fi через VPN-тунлель LocalDevVpn.",
        choices: [
          { text: "Как установить SideStore?", next: "ss_steps" },
          { text: "Назад", next: "iloader_intro" }
        ]
      },
      ss_steps: {
        text: "— Шаг 1: Установи SideStore через iLoader на компьютере.\n— Шаг 2: Скачай LocalDevVpn из App Store.\n— Шаг 3: Импортируй файл конфигурации VPN и включи туннель.\n— Шаг 4: Открывай SideStore и устанавливай любые IPA прямо на ходу!",
        choices: [
          { text: "Отлично, понятно!", next: "iloader_intro" }
        ]
      }
    };

    let currentState = 'start';
    let textInterval = null;
    let isTyping = false;
    let fullText = '';
    let displayedText = '';

    const textEl = document.getElementById('dialogue-text');
    const spriteEl = document.getElementById('breeze-sprite');
    const choicesEl = document.getElementById('choices-container');
    const arrowEl = document.getElementById('dialogue-arrow');
    const boxEl = document.getElementById('dialogue-box');

    // Helper to format text with actions *italic*
    function formatDialogueText(rawText) {
      return rawText.replace(/\*([^*]+)\*/g, '<span class="action-text">*$1*</span>');
    }

    function typeText(targetText, callback) {
      clearInterval(textInterval);
      isTyping = true;
      arrowEl.classList.remove('show');
      choicesEl.classList.remove('show');
      
      let index = 0;
      displayedText = '';
      
      // Remove HTML tags for counting characters but render them dynamically
      // Since formatDialogueText handles bold/italic/links, we type raw characters and update innerHTML
      textInterval = setInterval(() => {
        if (index < targetText.length) {
          displayedText += targetText[index];
          textEl.innerHTML = formatDialogueText(displayedText);
          index++;
        } else {
          clearInterval(textInterval);
          isTyping = false;
          arrowEl.classList.add('show');
          if (callback) callback();
        }
      }, 25);
    }

    function showState(stateKey) {
      currentState = stateKey;
      const stateObj = story[stateKey];
      
      // Trigger character bob bounce
      spriteEl.classList.add('bounce');
      setTimeout(() => spriteEl.classList.remove('bounce'), 500);

      fullText = stateObj.text;
      
      // Trigger action if present
      if (stateObj.action) {
        stateObj.action();
      }

      typeText(fullText, () => {
        renderChoices(stateObj.choices);
      });
    }

    function renderChoices(choices) {
      choicesEl.innerHTML = '';
      if (!choices || choices.length === 0) return;
      
      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c.text;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (c.action) c.action();
          if (c.next) showState(c.next);
        });
        choicesEl.appendChild(btn);
      });
      
      choicesEl.classList.add('show');
    }

    // Skip typing
    boxEl.addEventListener('click', () => {
      if (isTyping) {
        clearInterval(textInterval);
        isTyping = false;
        textEl.innerHTML = formatDialogueText(fullText);
        arrowEl.classList.add('show');
        renderChoices(story[currentState].choices);
      }
    });

    // Start Game
    window.addEventListener('load', () => {
      setTimeout(() => {
        spriteEl.classList.add('active');
        showState('start');
      }, 400);
    });
  </script>
</body>
</html>
